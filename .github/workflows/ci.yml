name: CI

on:
  push:
    branches: [main, experimental]
  pull_request:
    branches: [main, experimental]

permissions:
  contents: read
  issues: write

jobs:
  readme-check:
    name: README Updated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - name: Check for skip flag
        id: skip
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # %B = full commit message (subject + body), so [skip-readme] is honored
          # wherever it appears — matching the CI error text and the README docs,
          # which both say "commit message" (not "subject line").
          #
          # Scan EVERY commit in the push, not just the tip. The diff below
          # spans the whole range, so reading one commit meant putting the flag
          # on the commit that actually changed source did not count if another
          # commit followed it — a rule you could not satisfy without rewriting
          # the tip's message.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMIT_MSG=$(git log --format=%B "origin/${{ github.base_ref }}..HEAD" 2>/dev/null || git log -1 --format=%B)
          elif [ -n "${{ github.event.before }}" ] && git rev-parse -q --verify "${{ github.event.before }}^{commit}" >/dev/null 2>&1; then
            COMMIT_MSG=$(git log --format=%B "${{ github.event.before }}..HEAD")
          else
            COMMIT_MSG=$(git log -1 --format=%B)
          fi
          # Skip on explicit flag
          if echo "$COMMIT_MSG" | grep -qiE '\[(skip-readme|no-readme)\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif echo "$PR_TITLE" | grep -qiE '\[(skip-readme|no-readme)\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          # Skip on merge commits: whatever they bring in was already checked on
          # the branch. GitHub writes "Merge pull request #N from ..." — the old
          # pattern only matched "Merge branch", so a PR that CI had just
          # cleared via its [skip-readme] title was blocked again the moment it
          # landed on main, by a commit message nobody wrote and nobody could
          # edit.
          elif git rev-parse -q --verify HEAD^2 >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif echo "$COMMIT_MSG" | grep -qiE '^Merge (branch|pull request|remote-tracking)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check README updated (push)
        id: push_check
        if: github.event_name == 'push' && steps.skip.outputs.skip == 'false'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # A force-push leaves github.event.before pointing at a commit that is
          # no longer reachable. `git diff` then failed, `|| true` swallowed it,
          # and the step reported "No shipped source changes" and passed — a
          # green check whose stated reason was not the real one.
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse -q --verify "$BEFORE_SHA^{commit}" >/dev/null 2>&1; then
            if git rev-parse -q --verify HEAD~1 >/dev/null 2>&1; then
              DIFF_RANGE="HEAD~1..HEAD"
            else
              echo "No previous commit to compare against — README check skipped."
              exit 0
            fi
          else
            DIFF_RANGE="$BEFORE_SHA..HEAD"
          fi

          # Only require a README update if shipped source changed. Tests live
          # under src/ too, and a test-only change has nothing user-facing to
          # document — demanding one just trains people to write [skip-readme].
          SRC_FILES=$(git diff --name-only $DIFF_RANGE | grep '^src/' | grep -vE '\.test\.[cm]?ts$' || true)
          SRC_CHANGED=$(printf '%s' "$SRC_FILES" | grep -c . || true)
          if [ "$SRC_CHANGED" -eq 0 ]; then
            echo "No shipped source changes — README check skipped."
            exit 0
          fi

          echo "src_files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SRC_FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          README_CHANGED=$(git diff --name-only $DIFF_RANGE | grep -c '^README\.md$' || true)
          if [ "$README_CHANGED" -eq 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "::error::Source code changed but README.md was not updated."
            echo ""
            echo "Every push with source changes should include a README.md update."
            echo "If this change genuinely doesn't need a docs update, add [skip-readme] or [no-readme] to your commit message."
            exit 1
          fi

      - name: Check README updated (PR)
        id: pr_check
        if: github.event_name == 'pull_request' && steps.skip.outputs.skip == 'false'
        run: |
          DIFF_RANGE="origin/${{ github.base_ref }}...HEAD"

          # Same rule as the push check: tests under src/ do not owe a README.
          SRC_FILES=$(git diff --name-only $DIFF_RANGE | grep '^src/' | grep -vE '\.test\.[cm]?ts$' || true)
          SRC_CHANGED=$(printf '%s' "$SRC_FILES" | grep -c . || true)
          if [ "$SRC_CHANGED" -eq 0 ]; then
            echo "No shipped source changes — README check skipped."
            exit 0
          fi

          README_CHANGED=$(git diff --name-only $DIFF_RANGE | grep -c '^README\.md$' || true)
          if [ "$README_CHANGED" -eq 0 ]; then
            echo "::error::Source code changed but README.md was not updated in this PR."
            echo ""
            echo "Every PR with source changes should include a README.md update."
            echo "If this change genuinely doesn't need a docs update, add [skip-readme] or [no-readme] to your PR title."
            exit 1
          fi

      - name: README check passed
        if: steps.skip.outputs.skip == 'true'
        run: echo "README check skipped via commit message or PR title flag."

      - name: Create issue for README gap (push)
        if: failure() && steps.push_check.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          BRANCH="${{ github.ref_name }}"
          COMMIT_MSG=$(git log -1 --format=%s)
          SRC_FILES="${{ steps.push_check.outputs.src_files }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # This step only runs when the README check has ALREADY failed the
          # job, so it exists to notify, not to judge. On a repository with
          # issues disabled every gh call below fails and the log ends on
          # "repository has disabled issues" — which reads like the cause and
          # buries the actual one.
          if ! gh issue list --repo "$REPO_FULL" --limit 1 >/dev/null 2>&1; then
            echo "::notice::Issues are disabled here — skipping the README-gap issue. The README check itself is what failed."
            exit 0
          fi

          # Ensure readme-gap label exists
          gh label create "readme-gap" --repo "${{ github.repository }}" \
            --description "README.md not updated alongside source changes" \
            --color "D93F0B" 2>/dev/null || true

          # Check for existing open issue to avoid duplicates
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --label "readme-gap" --state open --limit 1 --json number -q '.[0].number' || true)

          if [ -n "$EXISTING" ]; then
            # Append a comment to the existing issue instead of creating a new one
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
              --body "Another push with source changes but no README update:

          - **Commit:** [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${COMMIT_SHA}) — ${COMMIT_MSG}
          - **Branch:** \`${BRANCH}\`
          - **CI run:** ${RUN_URL}
          - **Files changed:**
          \`\`\`
          ${SRC_FILES}
          \`\`\`"
            echo "Appended to existing issue #${EXISTING}"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "README.md out of date — source changed without docs update (${SHORT_SHA})" \
              --label "readme-gap,documentation" \
              --body "## README gap detected by CI

          A push to \`${BRANCH}\` changed source code without updating README.md.

          - **Commit:** [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${COMMIT_SHA}) — ${COMMIT_MSG}
          - **Branch:** \`${BRANCH}\`
          - **CI run:** ${RUN_URL}
          - **Source files changed:**
          \`\`\`
          ${SRC_FILES}
          \`\`\`

          ### What to do
          1. Review the changed source files above
          2. Update README.md to reflect any user-facing changes
          3. Push the README update (this issue will be auto-closed when CI passes)

          *If this change genuinely needs no docs update, close this issue with a comment explaining why.*"
            echo "Created new README gap issue"
          fi

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint lockfile
        run: npm run lockfile:lint

      - name: Audit dependencies
        run: npm audit --audit-level=critical

      # Covers src/ and, via tsconfig.test.json, the test files — which nothing
      # type-checked before: tsconfig.json excludes them and vitest strips
      # types without checking them.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
