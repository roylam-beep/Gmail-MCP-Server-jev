name: Publish release

# Publishes @geniushub/gmail-mcp when a v* tag is pushed:
# npm -> official MCP Registry (both over OIDC, no stored secrets).
#
# 🚨 npm PUBLISHES OVER OIDC, NOT A TOKEN. The runner mints a short-lived
# token per run instead of carrying a long-lived NPM_TOKEN that could publish
# under this account from anywhere it leaked to — and npm is switching tokens
# off for publishing in Jan 2027 anyway.
#
# 🚨 The trust must be registered on npmjs.com against the exact filename
# `publish.yml` and repo `roylam-beep/Gmail-MCP-Server-jev`. Renaming or moving
# this file makes npm refuse the run. Change it in both places or not at all.
# (This fork previously inherited a trust registered for
# ArtyMcLabin/Gmail-MCP-Server, which npm would have rejected here.)
#
# The MCP Registry namespace `io.github.roylam-beep/Gmail-MCP-Server-jev` is
# validated by GitHub OIDC against this repository's owner, so it needs no
# secret either.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC auth for the MCP Registry

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1; the runner image ships older, and
      # an older npm falls back to looking for a token that no longer exists.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      # npm cannot register a trusted publisher for a package that does not
      # exist yet (npm/cli#8544), so a brand-new package's first version has to
      # be published by hand. Without this guard the tag that follows fails on
      # "cannot publish over the previously published version" and takes the
      # mcp-registry job down with it, because that job `needs: npm`.
      # It also makes re-running a release tag safe after a partial failure.
      - name: Publish to npm (skip if this version is already there)
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm — nothing to publish."
            exit 0
          fi
          npm publish --access public

  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

